<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página con Bootstrap</title>

  <link href="bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <header class="bg-secondary  text-white text-center py-4">
    <h1>Mi Página Web con Bootstrap</h1>
  </header>

 
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Bienbenidos</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" href="#">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Servicios</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Contacto</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  
  <main class="container my-5">
    <div class="row">
      <div class="col-md-4">
        <div class="p-4 bg-light border text-center">
          <h3><img src="mer.jpg " class="img-fluid" alt=""></h3>
          <p>Mercedes Benz.</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="p-4 bg-light border text-center">
          <h3><img src="roll.jpg" class="img-fluid" alt=""></h3>
          <p>Contenido del segundo contenedor.</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="p-4 bg-light border text-center">
          <h3><img src="bmw.jpg" class="img-fluid" alt=""></h3>
          <p>Contenido del tercer contenedor.</p>
        </div>
      </div>
    </div>
  </main>


  <footer class="bg-dark text-white text-center py-4">
    <p>  Mi Página Web. Los mejores autos.</p>
    <p>Encuentra tu proximo auto.</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
